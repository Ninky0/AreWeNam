<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계절별 상품 목록</title>
    <link th:href="@{/css/fourseason.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/fourseason.js}"></script>
</head>
<body>

<!-- 계절별 비디오 배경 -->
<video id="background-video" autoplay loop muted playsinline class="background-video">
    <source src="/static/uploads/spring_bg.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div class="effect-layer" id="effectLayer"></div>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main>
    <div class="container">
        <h2>계절별 추천 상품 목록</h2>
        <!-- 계절 선택 탭 -->
        <div class="season-tabs tab-menu">
            <button class="season-tab tab-button active" data-season="1">봄</button>
            <button class="season-tab tab-button" data-season="2">여름</button>
            <button class="season-tab tab-button" data-season="3">가을</button>
            <button class="season-tab tab-button" data-season="4">겨울</button>
        </div>

        <!-- 상품 목록 영역 -->
        <div class="product-grid" id="productGrid"></div>

        <!-- 페이지네이션 -->
        <div class="pagination-container">
            <ul class="pagination" id="pagination"></ul>
        </div>
    </div>
</main>

<footer>
    <div class="footer-container">
        <p>&copy; 2024 WeatherWear. All rights reserved.</p>
        <ul>
            <li><a href="#">개인정보 처리방침</a></li>
            <li><a href="#">이용 약관</a></li>
        </ul>
    </div>
</footer>
</body>
</html>
