<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<body class="heather_body">

<!-- fragments/navbar.html -->
<nav th:fragment="navbar">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/css/heather.css}" rel="stylesheet">
    <script th:src="@{/js/heather.js}"></script>
    <div class="header">
        <div class="logo">
            <h1><a th:href="@{/home}">WeatherWear</a></h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a th:href="@{/user/product/list}">전체상품</a></li>
                <li><a th:href="@{/user/seasonproduct_list(season='1')}">계절별</a></li>
                <li><a th:href="@{/user/ootd_list}">커뮤니티</a></li>
            </ul>
        </nav>
        <div class="icon-container">
            <ul>
                <li><a th:href="@{/mypage}"><i class="fa-regular fa-user" style="color: #000000;"></i></a></li>
                <li sec:authorize="hasRole('ROLE_CUSTOMER')"><a th:href="@{/user/history}"><i class="fa-solid fa-truck" style="color: #000000;"></i></a></li>
                <li sec:authorize="hasRole('ROLE_CUSTOMER')"><a th:href="@{/user/shoppingcart}"><i class="fa-solid fa-bag-shopping" style="color: #000000;"></i></a></li>
                <li sec:authorize="hasRole('ROLE_CUSTOMER')"><a th:href="@{/user/search}"><i class="fa-solid fa-magnifying-glass" style="color: #000000;"></i></a></li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
